stages:
  - build
  - update-manifest

variables:
  IMAGE_NAME: $CI_REGISTRY_IMAGE


# Build Dev (develop 브랜치)
build-dev:
  stage: build
  image: docker:24
  services:
    - docker:24-dind
  rules:
    - if: $CI_COMMIT_BRANCH == "develop"
    - if: $CI_PIPELINE_SOURCE == "web"
      when: manual
  variables:
    TAG: "RHSA-$CI_COMMIT_SHA"
  script:
    - echo "Building DEV image with tag $TAG"
    - docker login -u $CI_REGISTRY_USER -p $CI_JOB_TOKEN $CI_REGISTRY
    - docker build -t $IMAGE_NAME:$TAG .
    - docker push $IMAGE_NAME:$TAG
  after_script:
    - echo "IMAGE_TAG=RHSA-$CI_COMMIT_SHA" >> build.env
  artifacts:
    reports:
      dotenv: build.env

update-manifest-dev:
  stage: update-manifest
  image: alpine:latest
  needs:
    - job: build-dev
      artifacts: true
  rules:
    - if: $CI_COMMIT_BRANCH == "develop"
  before_script:
    - apk add --no-cache git curl bash
  script:
    - |
      TAG="RHSA-$CI_COMMIT_SHA"

      # manifest repo 클론
      git clone https://oauth2:${MANIFEST_TOKEN}@${CI_SERVER_HOST}/${MANIFEST_PROJECT_PATH}.git manifest
      cd manifest

      git config user.name "GitLab CI"
      git config user.email "gitlab-ci@${CI_SERVER_HOST}"

      # develop 브랜치로 전환
      git checkout develop

      # 이미지 태그 업데이트
      sed -i "/repository:.*sw-campus-ai$/,/pullPolicy:/ s|tag: \".*\"|tag: \"$TAG\"|" k8s/environments/develop/values.yaml

      # 변경사항 커밋 & 푸시
      git add .
      if git diff --staged --quiet; then
        echo "No changes to commit"
      else
        git commit -m "chore(ai): update dev image to $TAG"
        git push origin develop
      fi


# Build Release (main 브랜치)
build-release:
  stage: build
  image: docker:24
  services:
    - docker:24-dind
  rules:
    - if: $CI_COMMIT_BRANCH == "main" && $CI_COMMIT_MESSAGE !~ /\[skip ci\]/
    - if: $CI_PIPELINE_SOURCE == "web"
      when: manual
  script:
    - |
      # pyproject.toml에서 버전 읽기
      apk add --no-cache sed grep
      CURRENT_VERSION=$(grep "^version = " pyproject.toml | cut -d'"' -f2)
      echo "Current version: $CURRENT_VERSION"

      # 버전 파싱 및 증가
      MAJOR=$(echo $CURRENT_VERSION | cut -d. -f1)
      MINOR=$(echo $CURRENT_VERSION | cut -d. -f2)
      PATCH=$(echo $CURRENT_VERSION | cut -d. -f3)
      NEW_PATCH=$((PATCH + 1))
      NEW_VERSION="${MAJOR}.${MINOR}.${NEW_PATCH}"
      VERSION_TAG="v${NEW_VERSION}"

      echo "New version: $NEW_VERSION (tag: $VERSION_TAG)"
      echo "VERSION_TAG=$VERSION_TAG" >> build.env
      echo "NEW_VERSION=$NEW_VERSION" >> build.env

      # pyproject.toml 업데이트
      sed -i "s/^version = \".*\"/version = \"$NEW_VERSION\"/" pyproject.toml

      # Docker 빌드 & 푸시
      docker login -u $CI_REGISTRY_USER -p $CI_JOB_TOKEN $CI_REGISTRY
      docker build -t $IMAGE_NAME:$VERSION_TAG .
      docker push $IMAGE_NAME:$VERSION_TAG
  artifacts:
    reports:
      dotenv: build.env
    paths:
      - pyproject.toml

commit-version-bump:
  stage: build
  image: alpine:latest
  needs:
    - job: build-release
      artifacts: true
  rules:
    - if: $CI_COMMIT_BRANCH == "main" && $CI_COMMIT_MESSAGE !~ /\[skip ci\]/
  before_script:
    - apk add --no-cache git
  script:
    - |
      git config user.name "GitLab CI"
      git config user.email "gitlab-ci@${CI_SERVER_HOST}"

      # 원격 저장소 설정
      git remote set-url origin https://oauth2:${PROJECT_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git

      git add pyproject.toml
      git commit -m "chore: bump version to $NEW_VERSION [skip ci]"
      git push origin HEAD:main

      # 태그 생성
      git tag -f "$VERSION_TAG"
      git push origin "$VERSION_TAG" -f

update-manifest-release:
  stage: update-manifest
  image: alpine:latest
  needs:
    - job: build-release
      artifacts: true
    - job: commit-version-bump
  rules:
    - if: $CI_COMMIT_BRANCH == "main" && $CI_COMMIT_MESSAGE !~ /\[skip ci\]/
  before_script:
    - apk add --no-cache git curl bash
  script:
    - |
      # manifest repo 클론
      git clone https://oauth2:${MANIFEST_TOKEN}@${CI_SERVER_HOST}/${MANIFEST_PROJECT_PATH}.git manifest
      cd manifest

      git config user.name "GitLab CI"
      git config user.email "gitlab-ci@${CI_SERVER_HOST}"

      # release 브랜치로 전환
      git checkout release

      # 이미지 태그 업데이트
      sed -i "/repository:.*sw-campus-ai$/,/pullPolicy:/ s|tag: \".*\"|tag: \"$VERSION_TAG\"|" k8s/environments/release/values.yaml

      # MR용 브랜치 생성
      BRANCH_NAME="auto-update/ai-$VERSION_TAG"
      git checkout -b "$BRANCH_NAME"

      git add .
      git commit -m "chore(ai): update prod image to $VERSION_TAG"
      git push origin "$BRANCH_NAME"

      # GitLab API로 MR 생성
      curl --request POST \
        --header "PRIVATE-TOKEN: ${MANIFEST_TOKEN}" \
        --header "Content-Type: application/json" \
        --data "{
          \"source_branch\": \"$BRANCH_NAME\",
          \"target_branch\": \"release\",
          \"title\": \"chore(ai): update prod image to $VERSION_TAG\",
          \"description\": \"Auto-generated MR from AI build\n\n- **Image**: \`$CI_REGISTRY_IMAGE:$VERSION_TAG\`\n- **Commit**: $CI_COMMIT_SHA\",
          \"remove_source_branch\": true
        }" \
        "https://${CI_SERVER_HOST}/api/v4/projects/${MANIFEST_PROJECT_ID}/merge_requests"
